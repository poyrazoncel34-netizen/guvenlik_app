# Privacy Policy - GitHub Pages ile otomatik yayın
# Repo Settings > Pages > Build and deployment > Source: GitHub Actions
name: Deploy Privacy Policy

on:
  push:
    branches: [main, master]
    paths:
      - '.gh-pages-publish/**'
      - 'store/privacy_policy*.html'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare public folder
        run: |
          mkdir -p public
          cp -r .gh-pages-publish/* public/ 2>/dev/null || true
          [ -f store/privacy_policy_en.html ] && cp store/privacy_policy_en.html public/
          [ -f store/privacy_policy.html ] && cp store/privacy_policy.html public/
          ls -la public/

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
