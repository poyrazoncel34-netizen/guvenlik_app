# KoruBeni - Android Analyze, Test, Build AAB
# Push to main veya manuel tetikleme ile çalışır.
# Gerekli secrets: KEYSTORE_BASE64, KEY_ALIAS, KEY_PASSWORD, STORE_PASSWORD, ENCRYPTION_KEY
# Opsiyonel: ANDROID_GOOGLE_SERVICES_JSON_BASE64 (base64 -i android/app/google-services.json)

name: Android CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gh-pages-publish/**'
      - 'store/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      - name: Check secrets availability
        id: check-secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}
          GOOGLE_SERVICES: ${{ secrets.ANDROID_GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "has_keystore=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_keystore=false" >> "$GITHUB_OUTPUT"
            echo "::warning::KEYSTORE_BASE64 secret yok — release build atlanacak"
          fi
          if [ -n "$ENCRYPTION_KEY" ]; then
            echo "has_encryption_key=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_encryption_key=false" >> "$GITHUB_OUTPUT"
            echo "::warning::ENCRYPTION_KEY secret yok — release build atlanacak"
          fi
          if [ -n "$GOOGLE_SERVICES" ]; then
            echo "has_google_services=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_google_services=false" >> "$GITHUB_OUTPUT"
            echo "::warning::ANDROID_GOOGLE_SERVICES_JSON_BASE64 secret yok — dummy google-services.json kullanılacak"
          fi

      - name: Decode keystore
        if: steps.check-secrets.outputs.has_keystore == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > android/korubeni-release-key.jks

      - name: Create key.properties
        if: steps.check-secrets.outputs.has_keystore == 'true'
        env:
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        run: |
          cat > android/key.properties << EOF
          storePassword=$STORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=korubeni-release-key.jks
          EOF

      - name: Create google-services.json
        env:
          B64: ${{ secrets.ANDROID_GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -n "$B64" ]; then
            echo "$B64" | base64 -d > android/app/google-services.json
          else
            echo "Dummy google-services.json oluşturuluyor (CI build için)..."
            cat > android/app/google-services.json << 'GSJSON'
          {
            "project_info": {
              "project_number": "000000000000",
              "firebase_url": "https://dummy.firebaseio.com",
              "project_id": "dummy-project",
              "storage_bucket": "dummy-project.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:000000000000:android:0000000000000000",
                  "android_client_info": {
                    "package_name": "com.poyrazoncel.korubeni"
                  }
                },
                "api_key": [
                  {
                    "current_key": "AIzaSyDummy000000000000000000000000000"
                  }
                ]
              }
            ],
            "configuration_version": "1"
          }
          GSJSON
          fi

      - name: Flutter pub get
        run: flutter pub get

      - name: Flutter analyze
        run: flutter analyze

      - name: Flutter test
        run: flutter test

      - name: Build AAB (release)
        if: steps.check-secrets.outputs.has_keystore == 'true' && steps.check-secrets.outputs.has_encryption_key == 'true'
        env:
          ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}
        run: |
          flutter build appbundle --release \
            --dart-define=ENV=production \
            --dart-define=ENCRYPTION_KEY="$ENCRYPTION_KEY"

      - name: Upload AAB
        if: steps.check-secrets.outputs.has_keystore == 'true' && steps.check-secrets.outputs.has_encryption_key == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: ignore
