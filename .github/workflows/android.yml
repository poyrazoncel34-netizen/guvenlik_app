# KoruBeni - Android Analyze, Test, Build AAB
# Push to main veya manuel tetikleme ile çalışır.
# Gerekli secrets: KEYSTORE_BASE64, KEY_ALIAS, KEY_PASSWORD, STORE_PASSWORD, ENCRYPTION_KEY

name: Android CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gh-pages-publish/**'
      - 'store/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Setup signing & secrets
        id: check-secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        run: |
          SIGN_OK=false

          # Keystore decode
          if [ -n "$KEYSTORE_BASE64" ]; then
            if echo "$KEYSTORE_BASE64" | base64 -d > android/korubeni-release-key.jks 2>/dev/null && [ -s android/korubeni-release-key.jks ]; then
              echo "✅ Keystore decode başarılı"
              # key.properties oluştur
              cat > android/key.properties << KPEOF
          storePassword=$STORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=korubeni-release-key.jks
          KPEOF
              SIGN_OK=true
            else
              echo "::warning::KEYSTORE_BASE64 secret var ama geçersiz base64 verisi — release build atlanacak"
              rm -f android/korubeni-release-key.jks
            fi
          else
            echo "::warning::KEYSTORE_BASE64 secret yok — release build atlanacak"
          fi

          echo "can_sign=$SIGN_OK" >> "$GITHUB_OUTPUT"

          if [ -n "$ENCRYPTION_KEY" ] && [ "$SIGN_OK" = "true" ]; then
            echo "can_build_release=true" >> "$GITHUB_OUTPUT"
          else
            echo "can_build_release=false" >> "$GITHUB_OUTPUT"
            [ -z "$ENCRYPTION_KEY" ] && echo "::warning::ENCRYPTION_KEY secret yok — release build atlanacak"
          fi

      - name: Flutter pub get
        run: flutter pub get

      - name: Flutter analyze
        run: flutter analyze

      - name: Flutter test
        run: flutter test

      - name: Build AAB (release)
        if: steps.check-secrets.outputs.can_build_release == 'true'
        env:
          ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}
        run: |
          flutter build appbundle --release \
            --dart-define=ENV=production \
            --dart-define=ENCRYPTION_KEY="$ENCRYPTION_KEY"

      - name: Upload AAB
        if: steps.check-secrets.outputs.can_build_release == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: ignore
