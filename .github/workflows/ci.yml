name: CI

# Lokal araç zinciriyle bilinçli eşitlendi; yükseltme HANDOVER §9'daki planlı işle birlikte yapılır.
env:
  FLUTTER_VERSION: "3.38.9"

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Test
        run: flutter test --no-pub

      - name: Create NON_RELEASE_SMOKE signing key
        run: |
          echo "::notice title=NON_RELEASE_SMOKE::Creating temporary CI signing material for PR/smoke validation only. This key must never be used for Play upload or release provenance."
          CI_STORE_PASSWORD="$(openssl rand -base64 24)"
          CI_KEY_PASSWORD="$(openssl rand -base64 24)"
          keytool -genkeypair \
            -v \
            -storetype JKS \
            -keystore android/app/ci-release.jks \
            -storepass "$CI_STORE_PASSWORD" \
            -keypass "$CI_KEY_PASSWORD" \
            -alias ci_upload \
            -keyalg RSA \
            -keysize 2048 \
            -validity 1 \
            -dname "CN=CI,O=KoruBeni,C=TR"
          cat > android/key.properties << EOF
          storePassword=$CI_STORE_PASSWORD
          keyPassword=$CI_KEY_PASSWORD
          keyAlias=ci_upload
          storeFile=app/ci-release.jks
          EOF

      - name: Build AAB (NON_RELEASE_SMOKE only, play flavor)
        env:
          REVENUECAT_ANDROID_API_KEY: ${{ secrets.REVENUECAT_ANDROID_API_KEY }}
        run: |
          echo "::notice title=NON_RELEASE_SMOKE::This app bundle validates buildability only. Dummy fallback keys may be used, so the artifact is not release-ready and must not be uploaded."
          CI_SMOKE_REVENUECAT_KEY="${REVENUECAT_ANDROID_API_KEY:-NON_RELEASE_SMOKE_REVENUECAT_KEY}"
          flutter build appbundle \
            --release \
            --flavor play \
            --dart-define=ENV=production \
            --dart-define=REVENUECAT_ANDROID_API_KEY="$CI_SMOKE_REVENUECAT_KEY"
