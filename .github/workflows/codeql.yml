name: CodeQL

# Dataflow / taint analizi -- MP-32-040, KARAR D-11 (2026-08-20).
#
# Neden CI'da, uygulamada degil
# -----------------------------
# Envelope URUNUN calisma zamanini baglar: gelistirici backend'i yok, analitik
# yok, acil yolda ag yok. CodeQL GitHub Actions icinde kosar; uygulamaya ne bir
# calisma zamani bagimliligi ne de analitik ekler. MP-32-040'in eski gerekcesi
# ("envelope ucuncu parti analiz servisini yasakliyor") bu iki seyi
# karistiriyordu ve D-11 ile duzeltildi.
#
# NE KAPSAR, NE KAPSAMAZ -- acikca
# --------------------------------
# CodeQL'in Dart analizoru YOKTUR. Bu depo 172 Dart dosyasi / 39.578 satir ve
# 48 Kotlin dosyasi / 6.110 satir tasiyor, yani bu kapi satir bazinda ~%13'u
# gorur. Gordugu %13 native acil cekirdegidir: EmergencySessionCoordinator,
# CountdownAlarmReceiver, DeviceProtectedEmergencySessionStore, DirectBootAccess,
# BootCompletedReceiver. Dart tarafi dataflow analizi olmadan kalir ve bunu
# kapatan bir arac bugun mevcut degildir. MP-32-040 bu yuzden PASS degil,
# kapsami adiyla anilan bir satir olarak notlanir -- kapatilmayan seyi
# kapatilmis gibi gostermek bu deponun tek yasak hareketi.
#
# build-mode: manual (F11)
# ------------------------
# build-mode: none Kotlin dosyalarini veritabanina ALMIYOR; GitHub bunu acikca
# belgeliyor, yani yukaridaki %13 fiilen 0 idi. Kotlin artik izlenen bir Android
# derlemesiyle cikariliyor: bu Flutter plugin registrant uretimini ve tam Android
# SDK zincirini gerektirir, bu yuzden analiz kapisi yayin zincirinin
# kirilganligina bagli hale gelir -- bilincli takas. `actions` kaynak-temelli
# modda kalir.
#
# Coordinator/receiver kaynaklarinin gercekten cikarildigi, CodeQL
# veritabani/log'undan DOGRULANMADAN native analiz kapsami iddia edilemez.
# Bu workflow metninde manual/autobuild yazmasi kanit degildir.
env:
  FLUTTER_VERSION: "3.38.9"

permissions:
  contents: read
  security-events: write

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 3 * * 1"

jobs:
  analyze:
    name: analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: java-kotlin
            build-mode: manual
          - language: actions
            build-mode: none

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@f3712979fa5f215279b101dd0a2e3bdfb4353324 # v3.37.7
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Setup Java
        if: matrix.language == 'java-kotlin'
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        if: matrix.language == 'java-kotlin'
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Generate locked Flutter plugin registration
        if: matrix.language == 'java-kotlin'
        run: flutter pub get --enforce-lockfile

      - name: Trace Android Kotlin compilation
        if: matrix.language == 'java-kotlin'
        working-directory: android
        run: ./gradlew :app:assemblePlayDebug --no-daemon --no-build-cache --rerun-tasks --console=plain -Pkotlin.compiler.execution.strategy=in-process

      - name: Analyze
        uses: github/codeql-action/analyze@f3712979fa5f215279b101dd0a2e3bdfb4353324 # v3.37.7
        with:
          category: "/language:${{ matrix.language }}"
