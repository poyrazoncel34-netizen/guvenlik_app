# KoruBeni - CI/CD Pipeline
# Android AAB + iOS build, tests, lint

name: Build & Test

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.x'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings || true

      - name: Run tests
        run: flutter test --no-pub

  android:
    name: Android Build
    runs-on: ubuntu-latest
    needs: analyze
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.x'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK (debug - no secrets)
        run: flutter build apk --debug --no-pub

      - name: Build AAB (release - requires secrets)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}
        run: |
          if [ -n "$ENCRYPTION_KEY" ]; then
            flutter build appbundle --release \
              --dart-define=ENV=production \
              --dart-define=ENCRYPTION_KEY="$ENCRYPTION_KEY" --no-pub
            echo "AAB build succeeded"
          else
            echo "ENCRYPTION_KEY secret not set - skipping release AAB"
          fi
        continue-on-error: true

  ios:
    name: iOS Build
    runs-on: macos-latest
    needs: analyze
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.x'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Install CocoaPods
        run: |
          cd ios && pod install --repo-update && cd ..
        continue-on-error: true

      - name: Build iOS (no codesign)
        run: flutter build ios --release --no-codesign --no-pub
        continue-on-error: true
