# KoruBeni - iOS Analyze, Test, Build
# Push to main veya manuel tetikleme ile çalışır.
# Gerekli secret: ENCRYPTION_KEY
# Opsiyonel: APP_STORE_CONNECT_API_KEY, certs/profiles (TestFlight için fastlane gerekir)
# Bu workflow: analyze + test + release build. TestFlight yükleme için ayrı fastlane setup gerekir.

name: iOS CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gh-pages-publish/**'
      - 'store/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Setup secrets
        id: check-secrets
        env:
          ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}
          GOOGLE_SERVICES: ${{ secrets.IOS_GOOGLE_SERVICE_INFO_PLIST_BASE64 }}
        run: |
          if [ -n "$ENCRYPTION_KEY" ]; then
            echo "can_build_release=true" >> "$GITHUB_OUTPUT"
          else
            echo "can_build_release=false" >> "$GITHUB_OUTPUT"
            echo "::warning::ENCRYPTION_KEY secret yok — release build atlanacak"
          fi
          if [ -n "$GOOGLE_SERVICES" ]; then
            echo "$GOOGLE_SERVICES" | base64 -d > ios/Runner/GoogleService-Info.plist 2>/dev/null || true
          fi
          if [ ! -s "ios/Runner/GoogleService-Info.plist" ]; then
            echo "::warning::Dummy GoogleService-Info.plist oluşturuluyor (CI build için)"
            cat > ios/Runner/GoogleService-Info.plist << 'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict><key>CLIENT_ID</key><string>1:000000000000:ios:0000000000000000</string><key>REVERSED_CLIENT_ID</key><string>com.googleusercontent.apps.000000000000</string><key>API_KEY</key><string>AIzaSyDummy000000000000000000000000000</string><key>GCM_SENDER_ID</key><string>000000000000</string><key>PLIST_VERSION</key><string>1</string><key>BUNDLE_ID</key><string>com.poyrazoncel.korubeni</string><key>PROJECT_ID</key><string>dummy-project</string><key>STORAGE_BUCKET</key><string>dummy-project.appspot.com</string><key>IS_ADS_ENABLED</key><false/><key>IS_ANALYTICS_ENABLED</key><false/></dict></plist>
          PLIST
          fi

      - name: Install CocoaPods
        run: |
          cd ios && pod install && cd ..

      - name: Flutter pub get
        run: flutter pub get

      - name: Flutter analyze
        run: flutter analyze

      - name: Flutter test
        run: flutter test

      - name: Build iOS (release)
        if: steps.check-secrets.outputs.can_build_release == 'true'
        env:
          ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}
        run: |
          flutter build ios --release --no-codesign \
            --dart-define=ENV=production \
            --dart-define=ENCRYPTION_KEY="$ENCRYPTION_KEY"

      - name: Upload build artifacts (xcarchive placeholder)
        if: steps.check-secrets.outputs.can_build_release == 'true'
        run: |
          echo "iOS build tamamlandı. TestFlight için Xcode Archive gerekir."
          echo "Yerelde: Xcode > Product > Archive > Distribute App"
