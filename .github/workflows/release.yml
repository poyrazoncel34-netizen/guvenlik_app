# ============================================================================
# KoruBeni — Google Play signed AAB release pipeline
# ============================================================================

name: Release Play AAB

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  build-play-aab:
    name: Build signed Play AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Flutter version info
        run: flutter --version

      - name: Extract version from tag
        id: version
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"
          CODE=$(( MAJOR * 10000 + MINOR * 100 + PATCH ))
          echo "version_name=$VERSION" >> $GITHUB_OUTPUT
          echo "version_code=$CODE" >> $GITHUB_OUTPUT
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Decode keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/korubeni_keystore.jks

      - name: Create key.properties
        run: |
          cat > android/key.properties << EOF
          storePassword=${{ secrets.STORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=app/korubeni_keystore.jks
          EOF

      - name: Flutter pub get
        run: flutter pub get

      - name: Flutter analyze
        run: flutter analyze --no-fatal-infos

      - name: Flutter test
        run: flutter test --no-pub

      - name: Build signed Play AAB
        run: |
          flutter build appbundle \
            --release \
            --flavor play \
            --build-name="${{ steps.version.outputs.version_name }}" \
            --build-number="${{ steps.version.outputs.version_code }}" \
            --dart-define=ENV=production \
            --dart-define=ENCRYPTION_KEY="${{ secrets.ENCRYPTION_KEY }}" \
            --dart-define=REVENUECAT_ANDROID_API_KEY="${{ secrets.REVENUECAT_ANDROID_API_KEY }}"

      - name: Upload Play AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: korubeni-play-${{ steps.version.outputs.version_name }}.aab
          path: build/app/outputs/bundle/playRelease/app-play-release.aab
          if-no-files-found: error
