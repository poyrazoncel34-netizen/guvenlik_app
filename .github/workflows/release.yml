# ============================================================================
# KoruBeni — Google Play signed AAB release pipeline
# ============================================================================

name: Release Play AAB

# Lokal araç zinciriyle bilinçli eşitlendi; yükseltme HANDOVER §9'daki planlı işle birlikte yapılır.
env:
  FLUTTER_VERSION: "3.38.9"

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  build-play-aab:
    name: Build signed Play AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Flutter version info
        run: flutter --version

      - name: Extract version from tag
        id: version
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"
          CODE=$(( MAJOR * 10000 + MINOR * 100 + PATCH ))
          echo "version_name=$VERSION" >> $GITHUB_OUTPUT
          echo "version_code=$CODE" >> $GITHUB_OUTPUT
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > android/app/korubeni_keystore.jks

      - name: Create key.properties
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          umask 077
          cat > android/key.properties << EOF
          storePassword=$STORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=app/korubeni_keystore.jks
          EOF

      - name: Flutter pub get
        run: flutter pub get

      - name: Flutter analyze
        run: flutter analyze --no-fatal-infos

      - name: Flutter test
        run: flutter test --no-pub

      - name: Build signed Play AAB
        env:
          ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}
          REVENUECAT_ANDROID_API_KEY: ${{ secrets.REVENUECAT_ANDROID_API_KEY }}
        run: |
          echo "::notice title=RELEASE_SECRETS_REDACTED::Building signed Play AAB with secret values supplied through masked environment variables."
          flutter build appbundle \
            --release \
            --flavor play \
            --obfuscate \
            --split-debug-info=build/debug-info \
            --build-name="${{ steps.version.outputs.version_name }}" \
            --build-number="${{ steps.version.outputs.version_code }}" \
            --dart-define=ENV=production \
            --dart-define=ENCRYPTION_KEY="$ENCRYPTION_KEY" \
            --dart-define=REVENUECAT_ANDROID_API_KEY="$REVENUECAT_ANDROID_API_KEY"

      - name: Upload Play AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: korubeni-play-${{ steps.version.outputs.version_name }}.aab
          path: build/app/outputs/bundle/playRelease/app-play-release.aab
          if-no-files-found: error

      # Retain Dart obfuscation symbols for crash de-obfuscation. Without these
      # split-debug-info symbols, release crash stack traces cannot be
      # symbolicated (flutter symbolize). Do NOT commit them to the repo.
      - name: Upload Dart obfuscation symbols
        uses: actions/upload-artifact@v4
        with:
          name: korubeni-debug-symbols-${{ steps.version.outputs.version_name }}
          path: build/debug-info
          if-no-files-found: error
