# ============================================================================
# KoruBeni — Otomatik İmzalı APK Release Pipeline
# ============================================================================
#
# Tetikleme: git tag v* push'u (örn: git tag v1.0.1 && git push --tags)
#
# Gerekli GitHub Secrets (Settings → Secrets → Actions):
#   KEYSTORE_BASE64   → base64 -i android/app/korubeni_keystore.jks | pbcopy
#   STORE_PASSWORD    → key.properties'deki storePassword
#   KEY_PASSWORD      → key.properties'deki keyPassword
#   KEY_ALIAS         → key.properties'deki keyAlias (genellikle "upload")
#   SENTRY_DSN        → Sentry proje DSN'i (https://...@sentry.io/...)
# ============================================================================

name: Release APK

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  build-and-release:
    name: Build Signed APK & Create Release
    runs-on: ubuntu-latest
    permissions:
      contents: write  # GitHub Release oluşturmak için gerekli

    steps:
      # 1. Kodu al
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Tag geçmişi için

      # 2. Java 17 kur (Gradle için zorunlu)
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 3. Flutter kur
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      # 4. Flutter versiyonunu logla
      - name: Flutter version info
        run: flutter --version

      # 5. Tag'dan versiyon bilgisini çıkar (v1.0.1 → name=1.0.1, code=101)
      - name: Extract version from tag
        id: version
        run: |
          TAG="${GITHUB_REF_NAME}"          # örn: v1.0.1
          VERSION="${TAG#v}"                # örn: 1.0.1
          # versionCode: major*10000 + minor*100 + patch (örn: 1.0.1 → 10001)
          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"
          CODE=$(( MAJOR * 10000 + MINOR * 100 + PATCH ))
          echo "version_name=$VERSION" >> $GITHUB_OUTPUT
          echo "version_code=$CODE"    >> $GITHUB_OUTPUT
          echo "tag=$TAG"              >> $GITHUB_OUTPUT
          echo "Version: $VERSION (code: $CODE)"

      # 6. Keystore'u Secret'tan decode et
      - name: Decode keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode \
            > android/app/korubeni_keystore.jks

      # 7. key.properties oluştur (Secret'lardan — düz metin dosya repo'ya girmez)
      - name: Create key.properties
        run: |
          cat > android/key.properties << EOF
          storePassword=${{ secrets.STORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=app/korubeni_keystore.jks
          EOF

      # 8. Bağımlılıkları yükle
      - name: Flutter pub get
        run: flutter pub get

      # 9. Dart analyzer çalıştır (opsiyonel — hata varsa erken yakala)
      - name: Flutter analyze
        run: flutter analyze --no-fatal-infos
        continue-on-error: false

      # 10. İmzalı full APK build et
      - name: Build release APK (full flavor)
        run: |
          flutter build apk \
            --release \
            --flavor full \
            --build-name="${{ steps.version.outputs.version_name }}" \
            --build-number="${{ steps.version.outputs.version_code }}" \
            --dart-define=ENV=production \
            --dart-define=SENTRY_DSN="${{ secrets.SENTRY_DSN }}"

      # 11. APK'yı yeniden adlandır (versiyonu içersin)
      - name: Rename APK
        run: |
          APK_PATH="build/app/outputs/flutter-apk/app-full-release.apk"
          NEW_NAME="KoruBeni-${{ steps.version.outputs.version_name }}.apk"
          mv "$APK_PATH" "build/app/outputs/flutter-apk/$NEW_NAME"
          echo "apk_name=$NEW_NAME" >> $GITHUB_ENV

      # 12. SHA256 checksum hesapla (kullanıcılar bütünlüğü doğrulayabilsin)
      - name: Generate SHA256 checksum
        run: |
          cd build/app/outputs/flutter-apk/
          sha256sum "${{ env.apk_name }}" > "${{ env.apk_name }}.sha256"
          echo "Checksum:"
          cat "${{ env.apk_name }}.sha256"

      # 13. GitHub Release oluştur + APK + checksum ekle
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "KoruBeni ${{ steps.version.outputs.version_name }}"
          body: |
            ## KoruBeni ${{ steps.version.outputs.version_name }}

            ### Kurulum
            1. `KoruBeni-${{ steps.version.outputs.version_name }}.apk` dosyasını indir
            2. Android cihazında **Bilinmeyen kaynaklardan yükleme**'ye izin ver
            3. APK'yı aç ve yükle

            ### Bütünlük Doğrulaması
            SHA256 checksum dosyasını indirip doğrula:
            ```
            sha256sum -c KoruBeni-${{ steps.version.outputs.version_name }}.apk.sha256
            ```

            ### Değişiklikler
            ${{ github.event.head_commit.message }}

            ---
            Build: `${{ steps.version.outputs.version_code }}`
            Flutter: stable channel
          files: |
            build/app/outputs/flutter-apk/${{ env.apk_name }}
            build/app/outputs/flutter-apk/${{ env.apk_name }}.sha256
          generate_release_notes: false
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
