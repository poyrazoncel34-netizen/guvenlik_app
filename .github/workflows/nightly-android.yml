name: Nightly Android API matrix

env:
  FLUTTER_VERSION: "3.38.9"

permissions:
  contents: read

on:
  schedule:
    - cron: "17 1 * * *"
  workflow_dispatch:

jobs:
  connected-safety:
    name: Connected safety API ${{ matrix.api-level }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        api-level: [29, 30, 31, 32, 33, 34, 35, 36]

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: 17

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Enable KVM permissions
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run connected safety tests
        uses: reactivecircus/android-emulator-runner@4c44018e59b437e86cdfc41da381398f93ed8808 # v2
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            set -euo pipefail
            cd android
            ./gradlew app:connectedPlayDebugAndroidTest --console=plain
            cd ..
            export ANDROID_SERIAL
            ANDROID_SERIAL="$(adb devices | awk 'NR == 2 { print $1 }')"
            export ADB_BIN
            ADB_BIN="$(command -v adb)"
            export PHASE3_CONFIRM_EPHEMERAL_AVD=1
            export PHASE3_EVIDENCE_OUTPUT="build/release-evidence/phase3-api${{ matrix.api-level }}-4kb.json"
            ./scripts/phase3_emulator_reboot_probe.sh

      - name: Upload emulator-only Direct Boot evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: phase3-emulator-api${{ matrix.api-level }}-4kb
          path: build/release-evidence/phase3-api${{ matrix.api-level }}-4kb.json
          if-no-files-found: error
